name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: warehouse_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=root --password=root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      APP_ENV: test
      APP_SECRET: github-actions-test-secret
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/warehouse_test?serverVersion=8.0&charset=utf8mb4"
      COMPOSER_NO_INTERACTION: 1

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v6

      - name: Konfiguracja PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: ctype, dom, iconv, mbstring, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Instalacja zależności
        run: composer install --prefer-dist --no-progress --optimize-autoloader

      - name: Kontrola zależności
        run: |
          composer validate --strict
          composer audit --locked --abandoned=fail

      - name: Migracje bazy testowej
        run: php bin/console doctrine:migrations:migrate --no-interaction --env=test

      - name: Kontrola konfiguracji
        run: |
          php bin/console lint:yaml config
          php bin/console lint:twig templates
          php bin/console lint:container
          php bin/console doctrine:schema:validate --env=test

      - name: Testy
        run: php bin/phpunit

  owasp:
    name: OWASP Top 10
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.170.0

    steps:
      - name: Pobranie kodu
        uses: actions/checkout@v6

      - name: Analiza OWASP Top 10
        run: semgrep scan --config p/owasp-top-ten --error src config templates public
