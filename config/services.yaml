# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    stock_receipt_document_directory: '%kernel.project_dir%/var/stock-receipts'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    App\Identity\Application\:
        resource: '../src/Identity/Application/'
        exclude:
            - '../src/Identity/Application/Dto/'
            - '../src/Identity/Application/Exception/'

    App\Identity\Infrastructure\:
        resource: '../src/Identity/Infrastructure/'
        exclude:
            - '../src/Identity/Infrastructure/Security/SecurityUser.php'
            - '../src/Identity/Infrastructure/Persistence/Doctrine/Fixtures/'
            - '../src/Identity/Infrastructure/Http/Form/UserFormData.php'

    App\Identity\Domain\Repository\UserRepository:
        alias: App\Identity\Infrastructure\Persistence\Doctrine\DoctrineUserRepository

    App\Identity\Application\Port\PasswordHasher:
        alias: App\Identity\Infrastructure\Security\SymfonyPasswordHasher

    App\Article\Application\:
        resource: '../src/Article/Application/'
        exclude:
            - '../src/Article/Application/Dto/'
            - '../src/Article/Application/Exception/'

    App\Article\Infrastructure\:
        resource: '../src/Article/Infrastructure/'

    App\Article\Domain\Repository\ArticleRepository:
        alias: App\Article\Infrastructure\Persistence\Doctrine\DoctrineArticleRepository

    App\Warehouse\Application\:
        resource: '../src/Warehouse/Application/'
        exclude:
            - '../src/Warehouse/Application/Dto/'
            - '../src/Warehouse/Application/Exception/'

    App\Warehouse\Infrastructure\:
        resource: '../src/Warehouse/Infrastructure/'
        exclude: '../src/Warehouse/Infrastructure/Http/Form/WarehouseFormData.php'

    App\Warehouse\Domain\Repository\WarehouseRepository:
        alias: App\Warehouse\Infrastructure\Persistence\Doctrine\DoctrineWarehouseRepository

    App\Stock\Application\:
        resource: '../src/Stock/Application/'
        exclude:
            - '../src/Stock/Application/Dto/'
            - '../src/Stock/Application/Exception/'

    App\Stock\Infrastructure\:
        resource: '../src/Stock/Infrastructure/'
        exclude:
            - '../src/Stock/Infrastructure/Http/Form/StockReceiptFormData.php'
            - '../src/Stock/Infrastructure/Http/Form/StockIssueFormData.php'

    App\Stock\Domain\Repository\StockReceiptRepository:
        alias: App\Stock\Infrastructure\Persistence\Doctrine\DoctrineStockReceiptRepository

    App\Stock\Domain\Repository\StockIssueRepository:
        alias: App\Stock\Infrastructure\Persistence\Doctrine\DoctrineStockIssueRepository

    App\Stock\Application\Port\ReceiptDocumentStorage:
        alias: App\Stock\Infrastructure\Filesystem\LocalReceiptDocumentStorage

    App\Stock\Infrastructure\Filesystem\LocalReceiptDocumentStorage:
        arguments:
            $directory: '%stock_receipt_document_directory%'

when@dev:
    services:
        App\Identity\Infrastructure\Persistence\Doctrine\Fixtures\:
            resource: '../src/Identity/Infrastructure/Persistence/Doctrine/Fixtures/'
            autowire: true
            autoconfigure: true

when@test:
    parameters:
        stock_receipt_document_directory: '%kernel.project_dir%/var/test/stock-receipts'

    services:
        App\Identity\Infrastructure\Persistence\Doctrine\Fixtures\:
            resource: '../src/Identity/Infrastructure/Persistence/Doctrine/Fixtures/'
            autowire: true
            autoconfigure: true
